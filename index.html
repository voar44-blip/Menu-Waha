<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="color-scheme" content="dark light"><meta name="theme-color" content="#0e0d0b"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0"><title>واحة العمدة – المنيو</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Reem+Kufi:wght@600;700&display=swap" rel="stylesheet">
<style>:root{--bg:#0e0d0b;--card:#1a1814;--tx:#f3ead6;--mu:#a89c82;--ac:#d4a537;--gr:#e6bd5a;--bd:#332e22;--glow:#1f1a10;--card2:#14120e;--tabs:rgba(14,13,11,.97);--arb:rgba(14,13,11,.55);--hg:linear-gradient(90deg,#b8902c,#f8e08a,#b8902c);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{scroll-padding-top:72px;scroll-behavior:smooth}
body{overflow-anchor:none;margin:0;background:var(--bg) radial-gradient(ellipse 120% 520px at 50% 0,var(--glow),transparent) no-repeat;color:var(--tx);font-family:Cairo,Tahoma,Arial,sans-serif;max-width:640px;margin-inline:auto;padding-bottom:40px;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
#sp{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;align-items:center;justify-content:center;transition:opacity .8s,visibility .8s}#sp.gone{opacity:0;visibility:hidden}
#sp img{width:170px;border-radius:50%;animation:pop 1s cubic-bezier(.2,.9,.2,1) both}
@keyframes pop{from{opacity:0;transform:scale(.6) rotate(-6deg)}to{opacity:1;transform:none}}
.p{position:fixed;bottom:-20px;border-radius:50%;background:var(--ac);opacity:0;z-index:0;pointer-events:none;animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.5}100%{transform:translateY(-110vh) translateX(20px);opacity:0}}
header,.car,.dots,#mn,footer,.tabs{position:relative;z-index:1}
header{text-align:center;padding:26px 16px 4px}
.lgw{position:relative;display:inline-block;animation:fl 4.5s ease-in-out infinite}.lgw::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--ac);animation:rg 2.6s ease-out infinite}
.lg{width:150px;height:auto;display:block;border-radius:50%;box-shadow:0 8px 30px rgba(212,165,55,.25)}
@keyframes fl{50%{transform:translateY(-6px)}}@keyframes rg{from{opacity:.8;transform:scale(1)}to{opacity:0;transform:scale(1.25)}}
h1{margin:10px 0 0;font-family:"Reem Kufi",Cairo,sans-serif;font-size:36px;letter-spacing:1px;background:var(--hg);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;}
@keyframes sh{to{background-position:-200% 0}}
header p{margin:2px 0 0;color:var(--mu);font-size:14px;animation:up 1s .4s both}@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.dv{display:flex;align-items:center;gap:10px;margin:12px 34px 6px}.dv::before,.dv::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--ac))}.dv::after{transform:scaleX(-1)}.dv i{width:8px;height:8px;background:var(--ac);transform:rotate(45deg);animation:sp 3s linear infinite}@keyframes sp{50%{transform:rotate(225deg) scale(1.3)}to{transform:rotate(405deg)}}
.car{margin:10px 14px;border-radius:20px;overflow:hidden;border:1px solid var(--ac);box-shadow:0 10px 36px rgba(0,0,0,.6),0 0 0 4px rgba(212,165,55,.08)}
.bar{position:absolute;top:0;left:0;right:0;height:3px;z-index:3;background:rgba(255,255,255,.12)}.bar b{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac),#f8e08a)}.bar b.run{animation:pg 4.5s linear forwards}@keyframes pg{to{width:100%}}
.tr{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;direction:ltr}.tr::-webkit-scrollbar{display:none}
.sl{flex:0 0 100%;scroll-snap-align:center;position:relative;aspect-ratio:1/1;overflow:hidden;cursor:zoom-in}.sl img{width:100%;height:100%;object-fit:cover;display:block;will-change:transform;transform:scale(1);transition:transform 6s linear}.sl.act img{transform:scale(1.13)}
.cp{position:absolute;inset:auto 0 0 0;padding:34px 14px 14px;color:#fff;font-weight:700;font-size:19px;text-align:center;direction:rtl;background:linear-gradient(transparent,rgba(0,0,0,.85));transform:translateY(60%);opacity:0;transition:all .7s .25s cubic-bezier(.2,.8,.2,1)}.sl.act .cp{transform:none;opacity:1}
.ar{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:var(--arb);color:var(--gr);font-size:22px;cursor:pointer;z-index:3;transition:.25s}.ar:active{transform:translateY(-50%) scale(.85);background:var(--ac);color:#000}.l{left:8px}.r{right:8px}
.dots{display:flex;justify-content:center;gap:5px;margin-top:10px;flex-wrap:wrap}.dots i{width:7px;height:7px;border-radius:4px;background:var(--bd);transition:all .4s}.dots i.on{background:var(--ac);width:22px}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:10px 14px;margin-top:14px;background:var(--tabs);border-bottom:1px solid var(--bd)}
.tabs button{flex:none;font:inherit;font-weight:700;font-size:15px;color:var(--mu);background:transparent;border:1px solid var(--bd);border-radius:20px;padding:6px 22px;cursor:pointer;transition:all .35s}.tabs button.on{color:#14110a;background:linear-gradient(135deg,#f0cd6e,var(--ac));border-color:var(--ac);box-shadow:0 4px 16px rgba(212,165,55,.35);transform:scale(1.06)}
h2{font-family:"Reem Kufi",Cairo,sans-serif;color:var(--gr);margin:24px 16px 10px;font-size:23px;display:flex;align-items:center;gap:10px}h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--ac),transparent)}
.rv{opacity:0;transform:translateY(28px) scale(.97);transition:opacity .7s cubic-bezier(.2,.8,.2,1),transform .7s cubic-bezier(.2,.8,.2,1)}.rv.in{opacity:1;transform:none}
.it{position:relative;overflow:hidden;display:flex;gap:12px;margin:0 14px 12px;background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--bd);border-radius:16px;padding:10px;align-items:center;box-shadow:0 4px 14px rgba(0,0,0,.45);transition:border-color .3s,box-shadow .3s}
.it::before{content:"";position:absolute;top:0;bottom:0;right:0;width:3px;background:linear-gradient(var(--gr),var(--ac));transform:scaleY(0);transition:transform .5s}.it.in::before{transform:scaleY(1);transition-delay:.4s}
.it:active{border-color:var(--ac);box-shadow:0 0 22px rgba(212,165,55,.3)}
.im{width:88px;height:88px;border-radius:12px;overflow:hidden;flex:none;cursor:zoom-in}.im img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}.it:active .im img{transform:scale(1.15)}
.it div.t{flex:1;min-width:0}.it b{display:block;font-size:16px;font-weight:700}.it span{display:block;color:var(--mu);font-size:12.5px;margin-top:3px;line-height:1.6}
.pr{flex:none;min-width:62px;text-align:center;color:var(--gr);font-weight:700;font-size:19px;border:1px solid var(--ac);border-radius:12px;padding:5px 8px;background:rgba(212,165,55,.08)}.pr small{display:block;font-size:10.5px;color:var(--mu);font-weight:400}
.it.in .pr{animation:pp .6s .5s both cubic-bezier(.3,1.6,.5,1)}@keyframes pp{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.cr{margin-top:14px;padding-top:12px;font-size:13px;color:var(--mu);position:relative}.cr::before{content:"";position:absolute;top:0;left:50%;width:60px;margin-left:-30px;height:1px;background:linear-gradient(90deg,transparent,var(--ac),transparent)}.cr b{font-family:"Reem Kufi",Cairo,sans-serif;font-size:16px;font-weight:700;background:var(--hg);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;}footer{text-align:center;color:var(--mu);font-size:12.5px;margin-top:26px}
.wa{display:inline-block;margin-top:9px;padding:6px 26px;border-radius:20px;background:linear-gradient(135deg,#f0cd6e,var(--ac));color:#14110a;font-weight:700;font-size:13px;text-decoration:none;box-shadow:0 4px 14px rgba(212,165,55,.3);transition:transform .2s}.wa:active{transform:scale(.92)}@keyframes wp{50%{box-shadow:0 4px 22px rgba(212,165,55,.65)}}
.tabs::-webkit-scrollbar{display:none}.tabs button:first-child{margin-inline-start:auto}.tabs button:last-child{margin-inline-end:auto}.st{animation:stm 2.4s ease-in-out infinite}.s2{animation-delay:.5s}.s3{animation-delay:1s}@keyframes stm{0%{opacity:0;transform:translateY(6px)}50%{opacity:.75}100%{opacity:0;transform:translateY(-7px)}}
#lb{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.93);display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:.35s}#lb.on{opacity:1;visibility:visible}#lb img{max-width:92vw;max-height:80vh;border-radius:16px;border:1px solid var(--ac);transform:scale(.7);transition:transform .5s cubic-bezier(.2,1.2,.3,1)}#lb.on img{transform:none}

:root[data-theme=light]{--bg:#faf5e8;--card:#fffdf7;--card2:#f6efdc;--tx:#2a2417;--mu:#74684c;--ac:#b8902c;--gr:#8f6c12;--bd:#e3d8bc;--glow:#f0e3b8;--tabs:rgba(250,245,232,.97);--arb:rgba(255,255,255,.75);--hg:linear-gradient(90deg,#8a6616,#c9981f,#8a6616)}
:root[data-theme=light] .it{box-shadow:0 4px 14px rgba(90,70,20,.12)}:root[data-theme=light] .car{box-shadow:0 10px 30px rgba(90,70,20,.22),0 0 0 4px rgba(184,144,44,.1)}:root[data-theme=light] .it::before{background:linear-gradient(#c9981f,#8f6c12)}
#tg{position:absolute;top:14px;left:14px;width:40px;height:40px;border-radius:50%;border:1px solid var(--ac);background:var(--card);color:var(--gr);font-size:19px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.25);transition:transform .25s,background .3s;z-index:5}#tg:active{transform:scale(.85) rotate(25deg)}
body,.it,.tabs,.pr{transition:background-color .35s,border-color .35s,color .35s}
