<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تم تحديث ونقل الموقع</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f3f6f4;
    --surface: #ffffff;
    --ink: #11251d;
    --muted: #5b6e65;
    --accent: #0f7a55;
    --accent-hover: #0b6244;
    --on-accent: #ffffff;
    --ring: rgba(15, 122, 85, .18);
    --border: #dfe8e3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0c1511;
      --surface: #131f1a;
      --ink: #eaf3ee;
      --muted: #9bb0a6;
      --accent: #2fc08a;
      --accent-hover: #4fd3a0;
      --on-accent: #06251a;
      --ring: rgba(47, 192, 138, .22);
      --border: #22342c;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Cairo", "Segoe UI", Tahoma, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    display: grid;
    place-items: center;
    padding: 24px;
    line-height: 1.8;
  }
  .card {
    width: 100%;
    max-width: 520px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 48px 36px 40px;
    text-align: center;
    box-shadow: 0 20px 50px -24px rgba(0, 0, 0, .25);
  }
  .icon {
    width: 84px; height: 84px;
    margin: 0 auto 24px;
    border-radius: 50%;
    display: grid; place-items: center;
    background: var(--ring);
    color: var(--accent);
  }
  .icon svg { width: 40px; height: 40px; }
  h1 {
    font-size: clamp(1.6rem, 5vw, 2.1rem);
    font-weight: 800;
    line-height: 1.4;
    margin-bottom: 12px;
  }
  p {
    color: var(--muted);
    font-size: 1.05rem;
    max-width: 38ch;
    margin: 0 auto 32px;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 14px 34px;
    border-radius: 14px;
    background: var(--accent);
    color: var(--on-accent);
    font: 600 1.1rem "Cairo", "Segoe UI", Tahoma, Arial, sans-serif;
    text-decoration: none;
    transition: background .2s, transform .2s, box-shadow .2s;
    box-shadow: 0 10px 24px -10px var(--accent);
  }
  .btn:hover { background: var(--accent-hover); transform: translateY(-2px); }
  .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
  .btn svg { width: 20px; height: 20px; }
  @media (max-width: 480px) {
    .card { padding: 40px 22px 32px; border-radius: 20px; }
    .btn { width: 100%; justify-content: center; }
  }
</style>
</head>
<body>
  <main class="card">
    <div class="icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12a9 9 0 1 1-3-6.7"/>
        <path d="M21 4v5h-5"/>
        <path d="M9 12l2 2 4-4"/>
      </svg>
    </div>
    <h1>تم تحديث ونقل الموقع</h1>
    <p>انتقل الموقع إلى عنوان جديد بتحديثات وتحسينات. اضغط على الزر للوصول إليه.</p>
    <a class="btn" href="https://elwaha.voar44.workers.dev/" rel="noopener">
      الانتقال إلى الموقع الجديد
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M19 12H5"/>
        <path d="M11 6l-6 6 6 6"/>
      </svg>
    </a>
  </main>
</body>
</html>
